<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inter is bundled (see src/main.tsx) — the edge CSP is same-origin, so a
         Google Fonts link would be blocked and silently fall back. -->
    <title>Fyredocs — Free Online PDF Tools</title>
    <meta name="description" content="Merge, split, compress, and convert PDFs online for free. Fast, secure, no installation required." />
    <meta name="author" content="Fyredocs" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <meta property="og:title" content="Fyredocs — Free Online PDF Tools" />
    <meta property="og:description" content="Merge, split, compress, and convert PDFs online for free. Fast, secure, no installation required." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Plausible Analytics (privacy-friendly, no cookies).
         plausible.io is explicitly allowlisted in the edge CSP (script-src and
         connect-src for the beacon) — see deployment/caddy/Caddyfile. Without
         that allowance both the script and its beacon are blocked silently.
         Replace data-domain with your actual domain when deploying. -->
    <script defer data-domain="fyredocs.com" src="https://plausible.io/js/script.js"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
